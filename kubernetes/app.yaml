apiVersion: v1
kind: ConfigMap
metadata:
    name: saasmetric-app-config
    namespace: dweb
data:
    DEBUG: "False"
    CELERY_BROKER_URL: "redis://saasmetric-redis-service:6379/0"
    CELERY_RESULT_BACKEND: "redis://saasmetric-redis-service:6379/0"
    POSTGRES_HOST: "saasmetric-psql-internal"
    POSTGRES_PORT: "5432"
    POSTGRES_NAME: "saasmetric_db"


---

apiVersion: apps/v1
kind: Deployment
metadata:
    name: saasmetric-app-deploy
    namespace: dweb
    labels:
        app: saasmetric-app
spec:
    replicas: 1
    selector:
        matchLabels:
            app: saasmetric-app
    template:
        metadata:
            name: saasmetric-app
            labels:
                app: saasmetric-app
        spec:
            initContainers:
                -   name: db-migration-job
                    image: akwasi14/saasmetrics:latest
                    command: ["python", "manage.py", "migrate", "--noinput"]
                    envFrom:
                        -   configMapRef:
                                name: saasmetric-app-config
                    env:
                        -   name: POSTGRES_USER
                            valueFrom:
                                secretKeyRef:
                                    key: POSTGRES_USER
                                    name: saasmetric-psql-secret
                        -   name: POSTGRES_PASSWORD
                            valueFrom:
                                secretKeyRef:
                                    key: POSTGRES_PASSWORD
                                    name: saasmetric-psql-secret
            containers:
                -   name: saasmetric-app-container
                    image: akwasi14/saasmetrics:latest
                    imagePullPolicy: IfNotPresent
                    envFrom:
                        -   configMapRef:
                                name: saasmetric-app-config
                    env:
                        -   name: POSTGRES_USER
                            valueFrom:
                                secretKeyRef:
                                    key: POSTGRES_USER
                                    name: saasmetric-psql-secret
                        -   name: POSTGRES_PASSWORD
                            valueFrom:
                                secretKeyRef:
                                    key: POSTGRES_PASSWORD
                                    name: saasmetric-psql-secret
                    ports:
                        -   containerPort: 8000
                    command:
                        -   "sh"
                        -   "-c"
                        -   |
                            python manage.py migrate --noinput && \
                            python manage.py collectstatic --noinput && \
                            python manage.py create_admin && \
                            gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 4 --timeout 60 --keep-alive 5 --access-logfile - --error-logfile - --log-level info


---
apiVersion: v1
kind: Service
metadata:
    name: saasmetric-app-svc
    namespace: dweb
spec:
    type: NodePort
    selector:
        app: saasmetric-app
    ports:
        -   port: 8000
            protocol: TCP
            targetPort: 8000
            nodePort: 30598
