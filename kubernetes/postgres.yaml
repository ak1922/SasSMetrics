apiVersion: v1
kind: ConfigMap
metadata:
    namespace: dweb
    name: saasmetric-psql-config
data:
    postgres-url: "saasmetric-psql-internal"
    create_database.sql: |
        CREATE DATABASE saasmetric_db WITH OWNER postgres ENCODING 'UTF8' LC_COLLATE 'en_US.utf8' LC_CTYPE 'en_US.utf8'


---
apiVersion: v1
kind: Secret
metadata:
    name: saasmetric-psql-secret
    namespace: dweb
type: Opaque
stringData:
    SECRET_KEY: "django-insecure-d18mi_x4b^$4c%d45@t@%a&rnbojw20ws((d2=ij_2c=mm^(fx"
    POSTGRES_USER: "postgres"
    POSTGRES_PASSWORD: "postgres"


---
apiVersion: v1
kind: Service
metadata:
    name: saasmetric-psql-internal
    namespace: dweb
spec:
    selector:
        app: saasmetric-psql
    ports:
        -   protocol: TCP
            port: 5432
            targetPort: 5432


---
apiVersion: v1
kind: Service
metadata:
    name: saasmetric-psql-external
    namespace: dweb
spec:
    selector:
        app: saasmetric-psql
    ports:
        -   protocol: TCP
            targetPort: 5432
            port: 5432
            nodePort: 30522
    type: NodePort


---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    namespace: dweb
    name: saasmetric-psql-pvc
spec:
    storageClassName: local-path
    accessModes:
        -   ReadWriteOnce
    resources:
        requests:
            storage: 2Gi


---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: saasmetric-psql-deploy
    namespace: dweb
    labels:
        app: saasmetric-psql
spec:
    replicas: 1
    selector:
        matchLabels:
            app: saasmetric-psql
    template:
        metadata:
            labels:
                app: saasmetric-psql
        spec:
            containers:
                -   name: saasmetric-psql-container
                    image: postgres:17.2
                    ports:
                        -   containerPort: 5432
                            protocol: TCP
                    env:
                        -   name: POSTGRES_USER
                            valueFrom:
                                secretKeyRef:
                                    name: saasmetric-psql-secret
                                    key: POSTGRES_USER
                        -   name: POSTGRES_PASSWORD
                            valueFrom:
                                secretKeyRef:
                                    name: saasmetric-psql-secret
                                    key: POSTGRES_PASSWORD
                    volumeMounts:
                        -   mountPath: /var/lib/postgresql/data
                            name: psql-storage
                        -   name: init-script-volume
                            mountPath: /docker-entrypoint-initdb.d
            volumes:
                -   name: psql-storage
                    persistentVolumeClaim:
                        claimName: saasmetric-psql-pvc
                -   name: init-script-volume
                    configMap:
                        name: saasmetric-psql-config
