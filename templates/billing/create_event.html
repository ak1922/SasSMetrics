{% extends 'base.html' %}

{% block title_content %}
	Log Subscription | Billing Core
{% endblock %}

{% block body_content %}
	<div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm border-0 p-4 bg-white">
                    <div class="card-body">
                        <h2 class="h4 fw-bold text-dark mb-4">Log New Subscription Event</h2>
                        <form method="POST" action="{% url 'billing:create_event' %}">
                            {% csrf_token %}
                            {% for field in form %}
                            	<div class="mb-3">
                                    <label for="{{ field.id_for_label }}" class="form-label text-muted small fw-bold">
                                        {{ field.label }}
                                    </label>
                                    {{ field }}
                                    {% for error in field.errors %}
                                        <div class="text-danger small mt-1">{{ error }}</div>
                                    {% endfor %}
                                </div>
                            {% endfor %}
                            <div class="d-flex gap-2 mt-4">
                                <button type="submit" class="btn btn-success">Log Event Entry</button>
                                <a href="" class="btn btn-soutline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
