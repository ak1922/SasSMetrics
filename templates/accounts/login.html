{% extends 'base.html' %}

{% block title_content %}
    Sign In | SaaS Executive Analytics
{% endblock %}

{% block body_content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-sm border-0 p-4 bg-white">
                <div class="card-body">
                    <h2 class="h4 fw-bold text-dark text-center mb-4">Account Login</h2>

                    <form method="post" action="{% url 'accounts:login' %}">
                        {% csrf_token %}

                        <!-- Username Processing Block -->
                        <div class="mb-3">
                            <label for="id_username" class="form-label text-muted small fw-bold">Username</label>
                            <input type="text" name="username" autofocus required id="id_username" class="form-control">
                        </div>

                        <!-- Password Processing Block -->
                        <div class="mb-4">
                            <label for="id_password" class="form-label text-muted small fw-bold">Password</label>
                            <input type="password" name="password" required id="id_password" class="form-control">
                        </div>

                        <!-- Error Alert Panel if authentication parameters fail -->
                        {% if form.errors %}
                            <div class="alert alert-danger small py-2" role="alert">
                                Invalid username or password. Please try again.
                            </div>
                        {% endif %}

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-block">Sign In to Dashboard</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
