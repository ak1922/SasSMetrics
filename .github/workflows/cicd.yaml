name: SaaS Analytics Engine Build & Push

on:
    push:
        branches:
            - main
            - billing
    workflow_dispatch:

jobs:
    run-tests:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Set up Python Runtime Environment
              uses: actions/setup-python@v5
              with:
                  python-version: '3.14'
                  cache: 'pip'

            - name: Install System Dependencies
              run: |
                  python -m pip install --upgrade pip
                  if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

            - name: Execute Application Test Suite
              env:
                  DJANGO_SETTINGS_MODULE: config.settings
                  SECRET_KEY: 'gha-temporary-ci-testing-key-string-123!'
              run: |
                  python manage.py test apps/billing/ apps/analytics/

    build-and-push:
        runs-on: ubuntu-latest
        needs: run-tests
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and Push Production Image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  tags: |
                      ${{ secrets.DOCKERHUB_USERNAME }}/saasmetrics:latest
                      ${{ secrets.DOCKERHUB_USERNAME }}/saasmetrics:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
