apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    name: saasmetric-argo
    namespace: argocd
spec:
    project: default
    source:
        path: kubernetes
        repoURL: git@github.com:ak1922/SasSMetrics.git
        targetRevision: HEAD
    destination:
        server: https://kmaz:6443
        namespace: dweb
    syncPolicy:
        automated:
          prune: true
          selfHeal: true
